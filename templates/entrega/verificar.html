{% extends 'base.html' %}
{% block title %}Registrar despacho – Despacho{% endblock %}

{% block content %}
<h2 class="mb-4">Registrar despacho de equipo</h2>

{% if messages %}
  {% for message in messages %}
    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}" role="alert">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<div class="card p-4 shadow-sm border-0">
  <form method="post">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">Equipo listo para despacho</label>
      <select name="diagnostico_id" class="form-select">
        <option value="" selected disabled>Selecciona un equipo listo para despacho</option>
        {% for d in diagnosticos_pendientes %}
          <option value="{{ d.id }}">
            [Diag {{ d.id }}] {{ d.equipo.nombre }} – {{ d.equipo.tipo }}
            – Técnico: {{ d.estudiante }}
            {% if d.equipo.preguntas_cliente %}
              — Información del equipo: {{ d.equipo.preguntas_cliente|truncatechars:80 }}
            {% endif %}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Observaciones</label>
      <textarea name="observaciones" class="form-control" rows="3"
                placeholder="Observaciones para el cliente (opcional)"></textarea>
    </div>

    <button type="submit" class="btn btn-success">Registrar despacho</button>
  </form>
</div>
{% endblock %}
